name: Spectrum, continuum, and FERRE integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.9'
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.13'
          - os: macos-15
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . build sphinx pytest
      - run: |
          python -m pip install --only-binary=:all: ferre==1.0.4
      - run: python -m pytest -q
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: python -m build
