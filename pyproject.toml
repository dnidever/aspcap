[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aspcap"
version = "0.2.0"
description = "Element abundance fits with FERRE"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.scripts]
aspcap = "aspcap.cli:main"

[tool.setuptools]
packages = ["aspcap"]

[tool.setuptools.package-data]
aspcap = ["data/*.hdr", "data/*.unf", "data/*-weights.json"]
