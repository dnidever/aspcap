[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aspcap"
version = "0.3.0"
description = "Element abundance fits with FERRE"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "David Nidever"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9", "ferre>=1.0.4", "f90nml>=1.4.4"]

[project.urls]
Documentation = "https://aspcap.readthedocs.io/"
Repository = "https://github.com/dnidever/aspcap"
Issues = "https://github.com/dnidever/aspcap/issues"

[project.scripts]
aspcap = "aspcap.cli:main"

[tool.setuptools]
packages = ["aspcap"]

[tool.setuptools.package-data]
aspcap = ["data/*.hdr", "data/*.unf", "data/*-weights.json"]
